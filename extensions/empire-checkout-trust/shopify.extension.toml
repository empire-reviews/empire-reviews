api_version = "2025-07"

# Empire Reviews — Checkout trust badge.
# Shows the store's average rating + review count during checkout as a
# conversion/social-proof signal. Merchants add it via the checkout editor.
[[extensions]]
name = "Empire Checkout Trust"
handle = "empire-checkout-trust"
uid = "58a1d065-e9c2-323a-7eff-93c5c2508559c06d9b11"
type = "ui_extension"

  [[extensions.targeting]]
  target = "purchase.checkout.block.render"
  module = "./src/Checkout.jsx"

  # Required to fetch the store-wide rating from the public reviews API.
  # Only aggregate store data is requested — no customer PII.
  [extensions.capabilities]
  network_access = true
